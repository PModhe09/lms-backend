# Local stack: Mongo (single-node replica set, needed for transactions), S3-compatible storage, API, seed, web.
# Expects ../lms-frontend checked out next to this repo.
# Usage: cp .env.example .env && docker compose up --build   →  http://localhost:3000
name: lms

services:
  mongo:
    image: mongo:8
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports: ['27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      # First run initiates the replica set; later runs just report status.
      # Member host is localhost so tools on the host machine can connect too; containers use directConnection.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 20

  # SeaweedFS speaks the S3 API. MinIO no longer publishes free container images.
  storage:
    image: chrislusf/seaweedfs:latest
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-s3.config=/etc/seaweedfs/s3.json']
    ports: ['8333:8333']
    volumes: ['storage-data:/data']
    configs:
      - source: s3-identities
        target: /etc/seaweedfs/s3.json
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:9333/cluster/status || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/lms?directConnection=true
      S3_ENDPOINT: http://storage:8333
    ports: ['4000:4000']
    restart: on-failure
    depends_on:
      mongo: { condition: service_healthy }
      storage: { condition: service_healthy }

  seed:
    build: .
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/lms?directConnection=true
    command: ['node', 'dist/seed-cli.js']
    depends_on:
      mongo: { condition: service_healthy }
    restart: 'no'

  web:
    build:
      context: ../lms-frontend
      args:
        API_ORIGIN: http://api:4000
    environment:
      API_ORIGIN: http://api:4000 # server-side fetches; the rewrite target is baked in at build time
      JWT_SECRET: ${JWT_SECRET}
    ports: ['3000:3000']
    depends_on:
      api: { condition: service_healthy }

configs:
  s3-identities:
    content: |
      {"identities": [{"name": "lms-api",
        "credentials": [{"accessKey": "${S3_ACCESS_KEY_ID}", "secretKey": "${S3_SECRET_ACCESS_KEY}"}],
        "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}

volumes:
  mongo-data:
  storage-data:
